name: Tests and package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s gateway/tests -v
      - run: python -m unittest discover -s telemetry/tests -v
      - run: python tools/check_public_tree.py
      - run: python gateway/download_dependencies.py
      - run: python -c "import sys; sys.path.insert(0, 'gateway'); from install_support import wheel_files; print(len(wheel_files('gateway-data/current/wheels')), 'dependency members verified')"
      - name: Robot syntax compatibility
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ['gateway/gateway.py','gateway/resource_telemetry.py','telemetry/robot_sampler.py']:
              ast.parse(Path(name).read_text(), feature_version=(3,7))
          PY
  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4
      - run: python -m unittest discover -s home_assistant/tests -v
